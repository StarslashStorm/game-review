{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <div class="bg-white rounded-3xl border border-gray-100 shadow-xl shadow-gray-200/40 p-8">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center text-red-600">
        <i class="fa-solid fa-trash-can"></i>
      </div>
      <h1 class="text-2xl font-black text-gray-900 tracking-tight">Delete this {{ object_type }}?</h1>
    </div>

    <p class="text-gray-600 mb-4">This can't be undone.</p>
    {% if object_type == "comment" %}
    <p class="text-sm text-gray-500 mb-4">Any replies to this comment will be deleted too.</p>
    {% endif %}

    <blockquote class="border-l-4 border-gray-200 pl-4 text-sm text-gray-700 mb-8 break-words">
      {{ object_preview|truncatechars:200 }}
    </blockquote>

    <form method="POST" class="flex items-center justify-end gap-3">
      {% csrf_token %}
      <a href="{{ cancel_url }}"
        class="px-6 py-3 rounded-xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all">
        Cancel
      </a>
      <button type="submit"
        class="cursor-pointer px-6 py-3 rounded-xl text-sm font-bold bg-red-600 hover:bg-red-700 text-white shadow-md shadow-red-200 transition-all">
        Yes, delete
      </button>
    </form>
  </div>
</div>
{% endblock %}

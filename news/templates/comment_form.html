{% extends "base.html" %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
  <div class="bg-white rounded-3xl border border-gray-100 shadow-xl shadow-gray-200/40 p-8">
    <h1 class="text-2xl font-black text-gray-900 tracking-tight mb-6">Edit your comment</h1>

    <form method="POST" class="space-y-4">
      {% csrf_token %}
      {{ form.content }}
      {% if form.content.errors %}
      <p class="text-red-500 text-xs font-bold">{{ form.content.errors.0 }}</p>
      {% endif %}

      <div class="flex items-center justify-end gap-3">
        <a href="{{ cancel_url }}"
          class="px-6 py-3 rounded-xl text-sm font-bold text-gray-500 hover:text-gray-700 hover:bg-gray-50 transition-all">
          Cancel
        </a>
        <button type="submit"
          class="cursor-pointer px-6 py-3 rounded-xl text-sm font-bold bg-orange-500 hover:bg-orange-600 text-white shadow-md shadow-orange-200 transition-all">
          Save changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
